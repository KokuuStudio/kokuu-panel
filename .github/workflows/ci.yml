name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# ★ 为什么需要 artifact：
#   actions logs 接口要仓库 admin 权限才拉得到，
#   只有 maintainer 的 token 能看到 CI 输出 —— 于是「CI 红了」这件事
#   对没有 admin 权限的协作者就是**黑盒**，只能看着红色猜。
#   把诊断信息（后端日志、失败断言、构建日志）作为 artifact 上传后，
#   任何有仓库读权限的人都能下载排查。
permissions:
  contents: read

jobs:
  # ── 接口测试（standalone）───────────────────────────────
  # 不依赖 MySQL：独立模式的账本是 JSONL，起一个 node 进程就够。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        working-directory: server
        run: npm ci

      - name: 起后端（standalone）
        working-directory: server
        env:
          BACKEND: standalone
          DATA_DIR: ./data-test
          PORT: '8799'
          HOST: 127.0.0.1
          SERVE_WEB: '0'
          ADMIN_TOKEN: testtoken123
          # Redis 不在 CI 里起：接口测试只碰 HTTP 层，
          # 回流走 /reflow/simulate 直接调 handle()，绕开了队列。
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          # ★ set -o pipefail 必须有：下面用 `| tee` 保存输出，
          #   没有它时管道的退出码取自 tee（永远 0），
          #   测试挂了这一 step 也会显示绿色 —— 假绿比红更糟。
          set -o pipefail

          # 日志落文件而不是只进 stdout：后端是后台进程，
          # 失败时 stdout 早就被后续输出冲掉了，只留文件才能 dump。
          node src/index.js > ../ci-server.log 2>&1 &
          echo $! > ../ci-server.pid

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8799/api/ping >/dev/null; then break; fi
            # 进程死了就别再空等 30 秒 —— 直接把日志打出来
            if ! kill -0 "$(cat ../ci-server.pid)" 2>/dev/null; then
              echo "::error::后端进程已退出，日志如下："
              cat ../ci-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:8799/api/ping >/dev/null; then
            echo "::error::后端 30 秒内没起来，日志如下："
            cat ../ci-server.log
            exit 1
          fi
          curl -s http://127.0.0.1:8799/api/ping; echo

          node src/apitest.mjs http://127.0.0.1:8799 testtoken123 2>&1 | tee ../api-test.out

      # ★ 两个测试拆成两步：合在一起时只能看到「起后端」红了，
      #   不知道是 apitest 挂了还是 reflowtest 挂了。
      #   拆开后结论直接体现在 step 名字上。
      - name: 回流测试
        working-directory: server
        run: |
          set -o pipefail
          node src/reflowtest.mjs http://127.0.0.1:8799 testtoken123 2>&1 | tee ../reflow-test.out
          # ★ 把完整输出写进 run summary —— artifact 要下载才能看，
          #   而 summary 直接显示在 GitHub 网页上，打开就能读。
          {
            echo '## 回流测试输出'
            echo '```'
            cat ../reflow-test.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传诊断信息（失败排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            ci-server.log
            reflow-test.out
            server/data-test/
          retention-days: 7
          if-no-files-found: ignore

  # ── 插件编译（Java 8 字节码）───────────────────────────
  # ★ 单独检查字节码版本：
  #   1.12.2 跑在 Java 8 上，编译成 17 的字节码会让老服务端直接
  #   "UnsupportedClassVersionError"，而且只在 1.12.2 上炸 ——
  #   开发用的是新 JDK，不检查就会漏过去。
  plugin:
    runs-on: ubuntu-latest
    steps:
      # ★ 插件是**独立仓库**（KokuuStudio/exchange-bridge），不是本仓库的子目录。
      #   之前写成 actions/checkout + path: exchange-bridge 会把本仓库
      #   再拉一遍到子目录里 —— 那里根本没有 Java 源码，mvn 会直接失败。
      - name: 拉取插件仓库
        uses: actions/checkout@v4
        with:
          repository: KokuuStudio/exchange-bridge
          path: exchange-bridge

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: exchange-bridge/pom.xml

      - name: 编译并打包
        working-directory: exchange-bridge
        run: mvn -B -q package -DskipTests

      - name: 校验字节码为 Java 8 可加载（major <= 52）
        working-directory: exchange-bridge
        run: |
          # ★ 这个检查第一版是错的，实测才发现：它 `find ... | head -1`
          #   随机抽一个 class 出来看 major，等于靠运气。
          #   shade 把 jedis / gson / slf4j 全打进 jar，实测 970 个 class 里混着：
          #     major 51 → 217 个（gson 等，Java 7 编译的，Java 8 能加载，没问题）
          #     major 52 → 752 个
          #     major 53 →   1 个（META-INF/versions/9/module-info.class）
          #   本地恰好抽到 52 → 绿；CI 上抽到 53 → 红。同样的代码，结论相反。
          #
          # ★ 为什么要排除 META-INF/：
          #   那个唯一的 53 是多版本 JAR 的模块声明（MR-JAR）。
          #   Java 8 根本不读 versions/ 目录，永远不会加载它 ——
          #   把它算进失败是纯误报。
          #
          # 正确判据：**Java 8 真会加载到的 class，major 都必须 <= 52**。
          JAR=$(ls target/*.jar | grep -v sources | grep -v original | head -1)
          echo "检查 $JAR"
          rm -rf target/classes-check
          unzip -o -q "$JAR" -d target/classes-check

          python3 - <<'PY'
          import pathlib, sys
          root = pathlib.Path('target/classes-check')
          dist, bad, n = {}, [], 0
          for f in root.rglob('*.class'):
              # MR-JAR 的 versions/ 目录 Java 8 不会加载，豁免
              if 'META-INF' in f.parts:
                  continue
              n += 1
              major = int.from_bytes(f.read_bytes()[6:8], 'big')  # 大端 u2
              dist[major] = dist.get(major, 0) + 1
              if major > 52:
                  bad.append((major, str(f)))
          print(f'共检查 {n} 个 class，major 分布 {dict(sorted(dist.items()))}')
          if bad:
              print('::error::以下 class 的 major > 52（Java 9+），'
                    '1.12.2 的 Java 8 加载会 UnsupportedClassVersionError')
              for major, path in bad[:20]:
                  print(f'  major {major}  {path}')
              sys.exit(1)
          print('全部 Java 8 会加载的 class 均为 major <= 52 —— 通过')
          PY

  # ── 镜像构建 ───────────────────────────────────────────
  # ★ 有了这一步，「Dockerfile 能不能构建」在 PR 上就能验证，
  #   而不是等部署到服务器才发现 COPY 路径写错。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kokuu-credit-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ★ 构建失败时把完整构建日志留下来。
      #   build-push-action 失败只给一行 summary，真正的原因（哪个 COPY
      #   的源不存在、第几行语法错）在日志里 —— 没有它就只能反复重跑试。
      #   buildx 的实际输出在 /tmp/buildx.log，要先 --debug 才会写。
      - name: 收集构建日志
        if: failure()
        run: |
          docker buildx build --progress=plain -t kokuu-credit-admin:ci . \
            > build-plain.log 2>&1 || true
          tail -100 build-plain.log

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: build-plain.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 冒烟：容器能起来且 /api/ping 有响应
        run: |
          docker run -d --name kk -p 8787:8787 \
            -e BACKEND=standalone -e ADMIN_TOKEN=ci-token \
            -e DATA_DIR=/data -e SERVE_WEB=1 kokuu-credit-admin:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/ping >/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::容器起来但 /api/ping 无响应"
            docker logs kk
            exit 1
          fi
          curl -s http://127.0.0.1:8787/api/ping
          echo
          docker logs kk 2>&1 | tail -20
          docker rm -f kk

  # ── compose 文件语法 ───────────────────────────────────
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 两份 compose 都要能解析
        run: |
          # ★ 两份 compose 都声明了 env_file: .env，而 .env 在 .gitignore 里
          #   （它含 ADMIN_TOKEN 与数据库口令，绝不能提交）。
          #   CI 里没有 .env，`docker compose config` 会直接失败。
          #   这里造一份临时的，只为让语法能被解析。
          cp .env.example .env

          # 独立模式：自带 mysql + redis
          docker compose -f docker-compose.yml config -q
          # 皮肤站模式：必须**没有** mysql / redis 服务（连宿主机）
          docker compose -f docker-compose.skin.yml config -q

          # 皮肤站那份里若混进了 mysql/redis，说明两份文件的边界又糊了 ——
          # 那会导致「皮肤站模式下误起第二个 MySQL，连上但全是空表」。
          if docker compose -f docker-compose.skin.yml config --services \
             | grep -qxE 'mysql|redis'; then
            echo "::error::docker-compose.skin.yml 不该包含 mysql/redis 服务（会与皮肤站的库冲突）"
            exit 1
          fi
          echo "两份 compose 语法 OK，且皮肤站那份不含 mysql/redis"
